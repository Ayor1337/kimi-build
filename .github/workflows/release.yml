name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
            binary: xai-grok-pager
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            platform: linux-aarch64
            binary: xai-grok-pager
          - os: macos-15-intel
            target: x86_64-apple-darwin
            platform: macos-x86_64
            binary: xai-grok-pager
          - os: macos-15
            target: aarch64-apple-darwin
            platform: macos-aarch64
            binary: xai-grok-pager
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
            binary: xai-grok-pager.exe

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.92.0
          targets: ${{ matrix.target }}

      - name: Install DotSlash
        run: cargo install dotslash --locked

      - name: Build release binary
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          GROK_VERSION="$version" cargo build \
            --profile release-dist \
            --features release-dist \
            -p xai-grok-pager-bin \
            --target "${{ matrix.target }}"

      - name: Stage release asset
        shell: bash
        run: |
          mkdir -p dist
          version="${GITHUB_REF_NAME#v}"
          source="target/${{ matrix.target }}/release-dist/${{ matrix.binary }}"
          suffix=""
          if [[ "${{ matrix.platform }}" == windows-* ]]; then
            suffix=".exe"
          fi
          cp "$source" "dist/kami-${version}-${{ matrix.platform }}${suffix}"

      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: kami-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create metadata
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          printf '%s\n' "$version" > dist/version.txt
          cd dist
          sha256sum kami-* > SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/*
          --verify-tag
          --title "Kimi Build $GITHUB_REF_NAME"
          --generate-notes
